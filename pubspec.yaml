name: my_beni
description: "A new Flutter project."

publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  share_plus: ^7.2.1
  image_picker: ^0.8.7+4
  just_audio: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # <-- Added for app icons

flutter:
  uses-material-design: true

  assets:
    - assets/icon/MusicP.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/MusicP.jpg"
